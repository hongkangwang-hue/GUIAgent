[project]
name = "gui-agent-w2"
version = "1.0.0"
description = "桌面感知与控制核心模块（第 2 周交付）"
requires-python = ">=3.10"

# **必须与源仓库一致（行宽 100）。** 不写这一段的话，ruff 找到的最近配置
# 就是本文件，退回默认的 88 字符，于是把这里的代码重排成和源仓库不同的
# 样子——交付副本与源码逐字对不上，评审时无从判断哪份是真的。
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "windows: 需要真实 Windows 桌面，CI 上跳过",
    "gpu: 需要可用 GPU",
    "slow: 耗时较长（OCR 推理等）",
]

[tool.coverage.run]
source = ["perception", "control"]
omit = [
    "*/__init__.py",
    # change.py 属于第 6 周交付（错误检测与自动重试），其测试在主仓库的
    # tests/test_retry_escalation.py。放在这里是因为它属于 perception 包，
    # 但**不计入本周的覆盖率**——否则会显示成 0%，那是误导。
    "*/perception/change.py",
]
